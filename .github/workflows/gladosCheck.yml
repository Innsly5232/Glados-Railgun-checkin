name: GLaDOS Check-in

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Cloud environment for compatibility testing'
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-latest
          - oracle
      mode:
        description: 'Check-in implementation for controlled live verification'
        type: choice
        default: browser
        options:
          - browser
          - extension
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    - cron: '18 9,12 * * *'
      timezone: 'Asia/Shanghai'

# 定时与手动触发可能重叠：同一时间只保留一个运行，避免重复签到与重复推送
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ${{ inputs.runner == 'oracle' && fromJSON('["self-hosted","glados-checkin-trial"]') || inputs.runner || 'ubuntu-latest' }}

    # 脚本自带 5 分钟运行预算；这里再兜底，避免异常情况卡住
    timeout-minutes: 15
      
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      if: ${{ inputs.runner != 'oracle' }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Use isolated Oracle Python
      if: ${{ inputs.runner == 'oracle' }}
      run: |
        echo /var/lib/glados-runner/venv/bin >> "$GITHUB_PATH"
        echo PLAYWRIGHT_BROWSERS_PATH=/var/lib/glados-runner/browsers >> "$GITHUB_ENV"

    # 安装 python 库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ "${{ inputs.runner }}" != "oracle" ]; then
          python -m playwright install --with-deps chromium
        fi
        if [ "$RUNNER_OS" = "Linux" ] && [ "${{ inputs.runner }}" != "oracle" ]; then
          sudo apt-get update
          sudo apt-get install -y xvfb
        fi

    - name: Run regression tests
      run: python -m unittest discover -s tests -q

    # 执行 签到脚本
    - name: Running checkin
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          xvfb-run -a python checkin.py
        else
          python checkin.py
        fi
      env:
        # 云端 Chromium 运行官网流程，不依赖个人电脑。
        GLADOS_CHECKIN_MODE: ${{ inputs.mode || 'browser' }}
        GLADOS_BROWSER_HEADLESS: 'false'
        HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
        HERMES_WEBHOOK_SSH_KEY: ${{ secrets.HERMES_WEBHOOK_SSH_KEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ inputs.mode == 'extension' && 'none' || secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    - name: Keep alive
      if: ${{ !cancelled() }}
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      if: ${{ !cancelled() }}
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
